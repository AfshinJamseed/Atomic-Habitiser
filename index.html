<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atomic Habitizer</title>
    <link rel="stylesheet" href="./style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="p-6 bg-zinc-950 text-zinc-100 min-h-screen max-w-4xl mx-auto cursor-default select-none">
    <header class="bg-zinc-700 mb-8">
      <section
        class="top mb-3 p-4 rounded flex justify-between items-center bg-zinc-700"
      >
        <div class="t-left">
          <h1
            class="text-2xl font-bold tracking-tight rounded p-1 bg-gradient-to-r from-green-400 to-teal-400 bg-clip-text text-transparent"
          >
            Habit Tracker
          </h1>
          <p class="text-sm text-blue-300 mt-1 font-medium ml-1">
            <span
              class="text-green-400 bg-zinc-900 py-0.25 px-1 rounded-xl"
              id="completed-count"
              >3</span
            >
            /
            <span
              class="text-green-400 bg-zinc-900 py-0.25 px-1 rounded-xl"
              id="total-count"
              >5</span
            >
            done today
          </p>
        </div>

        <div class="t-right flex flex-col items-end gap-2">
          <p
            class="text-sm font-semibold upp ercase tracking-wider text-zinc-400 bg-zinc-800 px-2.5 py-1 rounded-md"
            id="current-week"
          >
            Date-Date
          </p>
          <div class="buttons flex justify-around w-full">
            <button
              class="px-2.5 py-1 transition-colors duration-1.5 rounded cursor-pointer"
              id="prev-week-btn"
            >
              <i class="fa-solid fa-angle-left"></i>
            </button>
            <button
              class="px-2.5 py-1 transition-colors duration-1.5 rounded cursor-pointer"
              id="next-week-btn"
            >
              <i class="fa-solid fa-angle-right"></i>
            </button>
          </div>
        </div>
      </section>

      <section class="middle mb-3">
        <form
          class="input-group flex gap-2 w-full bg-zinc-700 rounded border border-zinc-500 transition-all duration-300 focus-within:border-emerald-500"
          id="habit-form"
        >
          <input
            type="text"
            placeholder="New Atomic Habit"
            class="focus:outline-none grow bg-rtransparent px-2 text-blue-400 placeholder-zinc-300 text-sm"
            id="habit-input"
          />
          <button
            type="submit"
            class="add-button bg:after-black-950 font-semibold"
            id="submit-btn"
          >
            Add Habit
          </button>
        </form>
      </section>
    </header>

    <main class="space-y-4" id="habits-container"></main>
    <script src="./script.js"></script>
  </body>
</html>
