<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atomic Habitizer</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Side bar -->
    <div class="dashboard-container">
      <!-- Top section -->
      <header class="top-section">
        <div class="heading">
          <span class="A">Atomic</span><span class="H">Habitizer</span>
        </div>
        <div class="middle">
          <h2 class="sub-title">Habit Streaks &<br />Performance</h2>
          <div class="widgets-container">
            <div class="ring-container">
              <svg width="76" height="76" viewBox="0 0 76 76">
                <circle class="ring-track" cx="38" cy="38" r="32"></circle>
                <circle
                  id="progress-ring-fill"
                  class="ring-fill"
                  cx="38"
                  cy="38"
                  r="33"
                  style="stroke-dasharray: 201.06; stroke-dashoffset: 86.45"
                ></circle>
              </svg>
              <div class="ring-label">
                <span class="percentage">62%</span>
                <span>done</span>
              </div>
            </div>

            <div class="max-streak-widget">
              <span class="widget-title">Current Max Streak</span>
              <div class="streak-badge">
                <i class="fa-solid fa-fire-flame-curved flame-icon"></i> 5 days
              </div>
            </div>
          </div>
        </div>

        <div class="bottom stats-grid">
          <div class="stats-item">
            <p>Total habits</p>
            <span class="count">3</span>
          </div>
          <div class="stats-item">
            <p>Current Week</p>
            <div class="current-week" id="current-week">...</div>
          </div>
          <div class="stats-item">
            <p>Pending Today</p>
            <span class="count" id="remaining-count">1</span>
          </div>
        </div>
      </header>
      <!-- Habits section -->
      <main class="habits-deck" id="habits-container">
        <div class="habit-row-card fitness">
          <div class="card-header-row">
            <div class="habit-meta">
              <!-- Left Side Accent Indicator -->
              <div class="accent-bar"></div>
              <div>
                <p>Hydrate 3L Water</p>
                <span class="category-tag">Fitness</span>
              </div>
              <div class="streak-pill">⚡3</div>
            </div>
            <i
              id="delete-habit"
              class="fa-regular fa-trash-can delete-habit"
            ></i>
          </div>

          <!-- Horizontal Weekly Checkers -->
          <div class="week-strip">
            <button class="day-node active-completed">
              <span class="day-name"
                >Mon <span class="date-box">- 12</span></span
              >
              <span class="dot-indicator"></span>
            </button>
            <button class="day-node active-completed">
              <span class="day-name"
                >Tue <span class="date-box">- 13</span></span
              >
              <span class="dot-indicator"></span>
            </button>
            <button class="day-node active-completed">
              <span class="day-name"
                >Wed <span class="date-box">- 14</span></span
              >
              <span class="dot-indicator"></span>
            </button>
            <button class="day-node">
              <span class="day-name"
                >Thu <span class="date-box">- 15</span></span
              >
              <span class="dot-indicator"></span>
            </button>
            <button class="day-node">
              <span class="day-name"
                >Fri <span class="date-box">- 16</span></span
              >
              <span class="dot-indicator"></span>
            </button>
            <button class="day-node">
              <span class="day-name"
                >Sat <span class="date-box">- 17</span></span
              >
              <span class="dot-indicator"></span>
            </button>
            <button class="day-node">
              <span class="day-name"
                >Sun <span class="date-box">- 18</span></span
              >
              <span class="dot-indicator"></span>
            </button>
          </div>
        </div>
      </main>
      <section class="input-section">
        <div class="add-habit-modal">
          <div class="form-section preset-section">
            <div class="section-label productivity-clr">Quick Presets</div>
            <div class="preset-row">
              <button class="preset-btn preset-btn-mind">
                <span class="preset-dot mind-bg"></span> Morning Meditation
              </button>
              <button class="preset-btn preset-btn-fitness">
                <span class="preset-dot fitness-bg"></span> Daily Workout
              </button>
              <button class="preset-btn preset-btn-productivity">
                <span class="preset-dot productivity-bg"></span> 30min Deep work
              </button>
            </div>
          </div>

          <!-- Input section -->
          <form class="form-section" id="habit-form">
            <label
              for="habit-name-field"
              class="section-label habit-name mind-clr"
              >Habit Name</label
            >
            <input
              type="text"
              id="habit-input"
              class="habit-input-text"
              placeholder="e.g. Code for 30 mins"
              autocomplete="off"
            />
          </form>

          <div class="form-section">
            <label class="section-label fitness-clr">Category</label>
            <div class="category-tabs">
              <button type="button" class="tab-item active">Fitness</button>
              <button type="button" class="tab-item">Mind</button>
              <button type="button" class="tab-item">Productivity</button>
            </div>
          </div>
          <div role="button" class="btn-submit-habit">
              Add Habit Tracker
              <div class="decor-line"></div>
          </div>
        </div>
      </section>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
