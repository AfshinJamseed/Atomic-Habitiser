<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Atomic Habitizer</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
		integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
		crossorigin="anonymous" referrerpolicy="no-referrer" />

	<!-- <link rel="stylesheet" href="./style.css" /> -->
</head>

<body>
	<div class="app-container">

		<!-- Sidebar -->
		<aside class="sidebar" id="sidebar">
			<div class="heading">
				<span class="A">Atomic</span>
				<span class="H">Habitizer</span>
			</div>

			<!-- Main Navigation -->
			<nav class="main-nav">
				<button class="nav-item active">
					<i class="fa-solid fa-house"></i>
					<p class="nav-name">Dashboard</p>
				</button>

				<button class="nav-item">
					<i class="fa-solid fa-repeat"></i>
					<p class="nav-name">Habits</p>
				</button>

				<button class="nav-item">
					<i class="fa-solid fa-user"></i>
					<p class="nav-name">Identities</p>
				</button>

				<button class="nav-item">
					<i class="fa-solid fa-book"></i>
					<p class="nav-name">History</p>
				</button>

				<button class="nav-item">
					<i class="fa-solid fa-chart-column"></i>
					<p class="nav-name">Analytics</p>
				</button>

				<button class="nav-item">
					<i class="fa-solid fa-gear"></i>
					<p class="nav-name">Settings</p>
				</button>
			</nav>

			<!-- Todays Progress ring -->
			<div class="section-progress">
				<p class="progress-header">Todays Progress</p>

				<div class="ring-container">
					<svg width="76" height="76" viewBox="0 0 76 76">
						<circle class="ring-track" cx="38" cy="38" r="32"></circle>
						<circle id="progress-ring-fill" class="ring-fill" cx="38" cy="38" r="33"
							style="stroke-dasharray: 201.06; stroke-dashoffset: 86.45"></circle>
					</svg>
					<div class="ring-label"><span class="percentage">62%</span></div>
				</div>

				<p>
					<span id="completed-count">0</span> /
					<span id="total-count">5</span>
				</p>

				<p class="keep-going">Keep Going 🚀</p>
			</div>

			<button class="quick-add-button">
				<p>Add New Habit</p>
				<i class="fa-solid fa-plus"></i>
			</button>
		</aside>

		<!-- Main Content -->
		<main>
			<header class="dashboard-header">
				<div class="header-greeting">
					<p>Welcome AFJ 👋</p>

					<section class="quote-card">
						<i class="fa-solid fa-quote-left"></i>
						<p style="display: inline;">
							Every action you take is a vote for <br>
							the person you wish to become.
						</p>
						<i class="fa-solid fa-quote-right"></i>
						<span>— James Clear</span>
					</section>
				</div>

				<div class="stats-grid">
					<div class="stat-card">
						<i class="fa-solid fa-crown"></i>
						<p class="value">7</p>
						<p class="stat-name">Best Streak</p>
					</div>

					<div class="stat-card">
						<i class="fa-solid fa-circle-check"></i>
						<p class="value">84%</p>
						<p class="stat-name">Total Completion</p>
					</div>

					<div class="stat-card">
						<i class="fa-solid fa-star"></i>
						<p class="value">1250</p>
						<p class="stat-name">Total XP</p>
					</div>
				</div>
			</header>

			<section class="identities-section">
				<div class="section-heading">
					
				</div>
			</section>
		</main>
	</div>
	<script src="./script.js"></script>
</body>

</html>
